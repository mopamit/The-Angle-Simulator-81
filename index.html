  :root{
    --blue:#17365e; --green:#6db580; --mustard:#e7b976; --bordo:#832058;
    --line:#6f7f8f; --grid:#ece8de; --bg:#f7f5ef; --card:#ffffff; --border:#e6e1d6; --radius:20px;
    --ui:"Simpler Pro","Segoe UI",Arial,sans-serif; --math:"Times New Roman",Georgia,serif;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--bg);color:var(--blue);font-family:var(--ui);font-size:18px;line-height:1.55}
  :focus-visible{outline:3px solid var(--bordo);outline-offset:3px}

  .topbar{direction:ltr;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:12px clamp(12px,3vw,28px);background:var(--card);border-bottom:1px solid var(--border)}
  .topbar .logo{height:42px;width:auto;display:block}
  .topbar h1{direction:rtl;text-align:center;margin:0;color:var(--bordo);font-weight:700;font-size:clamp(20px,2.4vw,28px);line-height:1.2}
  .topbar .actions{direction:rtl;display:flex;gap:10px}
  .btn{font-family:var(--ui);font-size:16px;font-weight:600;border-radius:12px;padding:9px 18px;min-height:44px;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--blue)}
  .btn:hover{background:#f3f1ea}

  main{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:22px;padding:22px clamp(12px,3vw,28px);max-width:1500px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 10px rgba(23,54,94,.05)}
  .instructions{padding:22px 24px;align-self:start}
  .instructions h2{color:var(--bordo);font-size:clamp(22px,2.4vw,30px);margin:0 0 10px;line-height:1.25}
  .instructions p{margin:0 0 12px}
  .readout{margin-top:16px;padding:16px;border-radius:14px;background:rgba(231,185,118,.18);text-align:center}
  .readout .deg{font-family:var(--math);font-size:44px;font-weight:700;line-height:1.1;direction:ltr;unicode-bidi:isolate;display:inline-block}
  .readout .type{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:999px;background:#edf8ef;color:#2f6b40;font-weight:700;font-size:19px}
  .stage{position:relative;padding:8px}
  .stage canvas{display:block;width:100%;height:clamp(420px, calc(100vh - 150px), 860px);touch-action:none;border-radius:14px}
  .m{direction:ltr;unicode-bidi:isolate;font-family:var(--math);white-space:nowrap}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:900px){
    main{grid-template-columns:1fr}
    .stage{order:-1}
    .stage canvas{height:auto;aspect-ratio:1000/640;min-height:280px}
    .topbar .logo{height:32px}
    .btn{padding:8px 12px;font-size:15px}
  }
  @media (max-width:520px){ .topbar{gap:8px} .topbar h1{font-size:18px} }
</style>

<script>
(() => {
  const C={blue:'#17365e',green:'#6db580',bordo:'#832058',line:'#6f7f8f',grid:'#ece8de'};
  const W={line:2.2,arc:3,ring:3}, POINT_R=7, HALO_R=14, HIT_R=30;

  /* ---------- מודל: אותו חישוב כמו בגרסה המקורית ---------- */
  const WORLD={w:1000,h:640};
  const V={x:500,y:WORLD.h*0.6};                 // הקודקוד: במרכז, מעט מתחת לאמצע
  const RAY=WORLD.h*0.35, ARC=WORLD.h*0.15;  // אורך הקרניים ורדיוס הקשת
  const INITIAL=Math.PI/4;                        // מתחילים ב־45°
  let ang=INITIAL;                                // רדיאנים, 0..2π, נגד כיוון השעון מהקרן הקבועה
  function getAngleType(d){
    if(Math.abs(d)<0.1||Math.abs(d-360)<0.1) return 'זווית אפס / שלמה';
    if(d<90) return 'זווית חדה';
    if(Math.abs(d-90)<0.1) return 'זווית ישרה';
    if(d<180) return 'זווית קהה';
    if(Math.abs(d-180)<0.1) return 'זווית שטוחה';
    return 'זווית נישאה';
  }
  function degreesNow(){ let d=Math.round(ang*180/Math.PI); if(d<0) d+=360; if(d===360) d=0; return d; }

  /* ---------- Canvas + DPR (מאפסים את ההגדלה בכל שינוי גודל) ---------- */
  const cv=document.getElementById('board'), ctx=cv.getContext('2d');
  let cssW=0,cssH=0,sc=1,ox=0,oy=0;
  function resize(){ const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1; cssW=r.width; cssH=r.height;
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    sc=Math.min(cssW/WORLD.w, cssH/WORLD.h); ox=(cssW-WORLD.w*sc)/2; oy=(cssH-WORLD.h*sc)/2; draw(); }
  new ResizeObserver(resize).observe(cv);
  const P=(x,y)=>({x:ox+x*sc,y:oy+y*sc});
  let hover=false, drag=false;

  function draw(){
    ctx.clearRect(0,0,cssW,cssH); ctx.lineCap='round'; ctx.lineJoin='round';
    const c=P(V.x,V.y), L=RAY*sc, A=ARC*sc;
    // רשת עדינה, מיושרת לקודקוד
    ctx.save(); ctx.strokeStyle=C.grid; ctx.lineWidth=1; ctx.setLineDash([2,4]); const g=50*sc;
    for(let x=c.x%g;x<cssW;x+=g){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cssH); ctx.stroke(); }
    for(let y=c.y%g;y<cssH;y+=g){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cssW,y); ctx.stroke(); }
    ctx.restore();

    const e1={x:c.x+L,y:c.y}, e2={x:c.x+Math.cos(-ang)*L,y:c.y+Math.sin(-ang)*L};
    // 1. הזווית: אזור צבוע וקשת
    ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.arc(c.x,c.y,A,0,-ang,true); ctx.closePath();
    ctx.fillStyle='rgba(109,181,128,.16)'; ctx.fill();
    ctx.strokeStyle=C.green; ctx.lineWidth=W.arc; ctx.beginPath(); ctx.arc(c.x,c.y,A,0,-ang,true); ctx.stroke();
    // 2. הקרניים
    ctx.strokeStyle=C.line; ctx.lineWidth=W.line;
    for(const e of [e1,e2]){ ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(e.x,e.y); ctx.stroke(); }
    // 3. הקודקוד
    ctx.fillStyle='#fff'; ctx.strokeStyle=C.blue; ctx.lineWidth=W.ring; ctx.beginPath(); ctx.arc(c.x,c.y,POINT_R,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.blue; ctx.beginPath(); ctx.arc(c.x,c.y,2.2,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.fillStyle=C.line; ctx.font=`600 ${Math.max(15,Math.round(17*sc))}px "Simpler Pro",Arial,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.direction='rtl'; ctx.fillText('קודקוד', c.x, c.y+30*Math.max(1,sc)); ctx.restore();
    // 4. הנקודה שגוררים – בקצה הקרן
    if(hover||drag){ ctx.fillStyle='rgba(131,32,88,.15)'; ctx.beginPath(); ctx.arc(e2.x,e2.y,HALO_R,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle='#fff'; ctx.strokeStyle=C.bordo; ctx.lineWidth=W.ring; ctx.beginPath(); ctx.arc(e2.x,e2.y,POINT_R,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.bordo; ctx.beginPath(); ctx.arc(e2.x,e2.y,2.2,0,Math.PI*2); ctx.fill();
    // 5. הערך על השרטוט, על חוצה הזווית
    const d=degreesNow(), bis=-ang/2, tr=A+40*Math.max(1,sc);
    ctx.save(); ctx.direction='ltr'; ctx.font=`700 ${Math.max(16,Math.round(20*sc))}px "Times New Roman",Georgia,serif`;
    ctx.fillStyle=C.blue; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(`${d}°`, c.x+Math.cos(bis)*tr, c.y+Math.sin(bis)*tr); ctx.restore();
    // 6. החלונית
    document.getElementById('angle-display').textContent=`${d}°`;
    document.getElementById('type-display').textContent=getAngleType(d);
    cv.style.cursor = drag?'grabbing':(hover?'grab':'default');
  }

  /* ---------- גרירה (Pointer Events) ---------- */
  const local=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  function nearHandle(p){ const c=P(V.x,V.y), L=RAY*sc, hx=c.x+Math.cos(-ang)*L, hy=c.y+Math.sin(-ang)*L; return Math.hypot(p.x-hx,p.y-hy)<HIT_R; }
  function setFrom(p){ const c=P(V.x,V.y); let a=-Math.atan2(p.y-c.y,p.x-c.x); while(a<0) a+=Math.PI*2; while(a>=Math.PI*2) a-=Math.PI*2; ang=a; draw(); }
  cv.addEventListener('pointerdown',e=>{
    const p=local(e), c=P(V.x,V.y);
    if(nearHandle(p) || Math.hypot(p.x-c.x,p.y-c.y)>40){ drag=true; cv.setPointerCapture(e.pointerId); e.preventDefault(); setFrom(p); }
  });
  cv.addEventListener('pointermove',e=>{ const p=local(e); if(drag){ setFrom(p); return; } const h=nearHandle(p); if(h!==hover){ hover=h; draw(); } });
  const end=()=>{ if(!drag) return; drag=false; draw(); };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',()=>{ if(!drag&&hover){ hover=false; draw(); } });

  /* ---------- מקלדת ---------- */
  cv.addEventListener('keydown',e=>{
    const k={ArrowLeft:1,ArrowUp:1,ArrowRight:-1,ArrowDown:-1}[e.key]; if(!k) return; e.preventDefault();
    const step=(e.shiftKey?5:1)*Math.PI/180; ang=((ang+k*step)%(Math.PI*2)+Math.PI*2)%(Math.PI*2); draw();
  });

  document.getElementById('resetBtn').addEventListener('click',()=>{ ang=INITIAL; draw(); });
  window.__S3={get ang(){return ang;}, set ang(v){ang=v;draw();}, getAngleType, degreesNow};
  document.fonts?.ready.then(draw);
  resize();
})();
</script>
</body>
</html>
